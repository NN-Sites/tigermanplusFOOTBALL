<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>פאנל אדמין ומסך ירוק ל-OBS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Rubik', sans-serif; }
    
    /* OBS Green Screen Background Toggle */
    .green-screen {
      background-color: #00FF00 !important;
    }

    /* Top to Bottom Alert Animation */
    @keyframes slideDown {
      0% { transform: translateY(-150%); opacity: 0; }
      15% { transform: translateY(0); opacity: 1; }
      85% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-150%); opacity: 0; }
    }

    .animate-slide-down {
      animation: slideDown 5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style>
</head>
<body id="mainBody" class="bg-slate-950 text-white min-h-screen p-6">

  <!-- Floating Alert Container for OBS (Chroma Key Target) -->
  <div id="alertContainer" class="fixed top-6 left-0 right-0 z-50 flex justify-center pointer-events-none px-4">
    <div id="alertBox" class="hidden animate-slide-down bg-slate-900/95 border-4 border-yellow-400 text-white rounded-3xl p-5 shadow-2xl max-w-xl w-full text-center backdrop-blur-md">
      <div class="text-2xl md:text-3xl font-black text-yellow-400 drop-shadow">
        <span id="alertName" class="text-white"></span> ניחש שיגמר <span id="alertPrediction" class="text-yellow-400"></span>
      </div>
      <div class="text-xs md:text-sm text-slate-300 font-semibold mt-1">
        (קישור לניחושים בתגובה המוצמדת ובתיאור הלייב)
      </div>
    </div>
  </div>

  <!-- Admin Controls -->
  <div id="adminPanel" class="max-w-4xl mx-auto space-y-6">
    <div class="flex flex-col sm:flex-row justify-between items-center bg-slate-900 border border-slate-800 p-6 rounded-2xl gap-4">
      <div>
        <h1 class="text-2xl font-black text-yellow-400">🎮 פאנל ניהול ומסך ירוק ל-OBS</h1>
        <p class="text-slate-400 text-sm">התראות קופצות בזמן אמת מ-Firebase</p>
      </div>
      <div class="flex flex-wrap gap-3">
        <button id="toggleGreenBtn" class="bg-green-600 hover:bg-green-500 font-bold px-4 py-2.5 rounded-xl transition text-sm">
          📺 מצב מסך ירוק (OBS)
        </button>
        <button id="testAlertBtn" class="bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-bold px-4 py-2.5 rounded-xl transition text-sm">
          ⚡ בדיקת התראה
        </button>
        <button id="resetLocalBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-3 py-2.5 rounded-xl transition text-xs border border-slate-700">
          🔄 אפס ניחוש שמור בדפדפן
        </button>
      </div>
    </div>

    <!-- Predictions List -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
      <h2 class="text-xl font-bold mb-4 text-slate-200">רשימת ניחושים בזמן אמת (<span id="count">0</span>)</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-right">
          <thead>
            <tr class="border-b border-slate-800 text-slate-400 text-sm">
              <th class="pb-3">שם הצופה</th>
              <th class="pb-3">ניחוש</th>
              <th class="pb-3">זמן</th>
            </tr>
          </thead>
          <tbody id="predictionsTable" class="divide-y divide-slate-800/50 text-sm">
            <tr>
              <td colspan="3" class="py-4 text-center text-slate-500">טוען ניחושים...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDYPu5Fdlcbq-SPZmS-8SmFL3if2aM0lFo",
      authDomain: "followbuildil.firebaseapp.com",
      projectId: "followbuildil",
      storageBucket: "followbuildil.firebasestorage.app",
      messagingSenderId: "71902350555",
      appId: "1:71902350555:web:15fdb3161d60c6cbc1d0fe",
      measurementId: "G-186GSM3KKS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const mainBody = document.getElementById('mainBody');
    const adminPanel = document.getElementById('adminPanel');
    const alertBox = document.getElementById('alertBox');
    const alertName = document.getElementById('alertName');
    const alertPrediction = document.getElementById('alertPrediction');
    const predictionsTable = document.getElementById('predictionsTable');
    const countSpan = document.getElementById('count');

    let isInitialLoad = true;

    // Trigger Alert Animation
    function showAlert(name, prediction) {
      alertName.innerText = name;
      alertPrediction.innerText = prediction;

      alertBox.classList.remove('hidden', 'animate-slide-down');
      void alertBox.offsetWidth; // Trigger reflow
      alertBox.classList.add('animate-slide-down');

      setTimeout(() => {
        alertBox.classList.add('hidden');
      }, 5000);
    }

    // Toggle Green Screen Mode
    document.getElementById('toggleGreenBtn').addEventListener('click', () => {
      mainBody.classList.toggle('green-screen');
      adminPanel.classList.toggle('hidden');
    });

    // Test Alert Button
    document.getElementById('testAlertBtn').addEventListener('click', () => {
      showAlert("נועם", "2 - 1 לבית\"ר");
    });

    // Reset local prediction memory
    document.getElementById('resetLocalBtn').addEventListener('click', () => {
      localStorage.removeItem('has_predicted_game');
      alert("הניחוש השמור במכשיר זה אופס!");
    });

    // Real-time listener for predictions
    const q = query(collection(db, "predictions"), orderBy("timestamp", "desc"));
    
    onSnapshot(q, (snapshot) => {
      countSpan.innerText = snapshot.docs.length;
      predictionsTable.innerHTML = "";

      if (snapshot.docs.length === 0) {
        predictionsTable.innerHTML = `<tr><td colspan="3" class="py-4 text-center text-slate-500">אין ניחושים עדיין</td></tr>`;
        return;
      }

      snapshot.docChanges().forEach((change) => {
        if (change.type === "added" && !isInitialLoad) {
          const data = change.doc.data();
          showAlert(data.name, data.prediction);
        }
      });

      snapshot.docs.forEach((doc) => {
        const data = doc.data();
        const timeStr = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }) : 'עכשיו';
        
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-800/30 transition";
        tr.innerHTML = `
          <td class="py-3 font-bold text-yellow-400">${data.name}</td>
          <td class="py-3">${data.prediction}</td>
          <td class="py-3 text-slate-500 text-xs">${timeStr}</td>
        `;
        predictionsTable.appendChild(tr);
      });

      isInitialLoad = false;
    });
  </script>
</body>
</html>
